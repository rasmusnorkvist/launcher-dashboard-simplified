<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Dashboard</title>
<!-- Land Advisors mark: browser tab, iPhone "Add to Home Screen", and "install as app". -->
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="site-header">
    <div class="brand-name">Land Advisors NW</div>
    <span class="site-header-note">Internal Tools</span>
  </header>

  <main class="page-wrap">
    <h1 class="page-title">Project Dashboard</h1>

    <div class="grid-wrap" role="list">
      <div class="card" role="listitem">
        <h2 class="card-title">Builder Matrix</h2>
        <div class="card-actions">
          <a class="btn" href="https://rasmusnorkvist.github.io/builder_site/" aria-label="Open Builder Matrix">Open</a>
        </div>
      </div>

      <div class="card" role="listitem">
        <h2 class="card-title">Project Tracker</h2>
        <div class="card-actions">
          <a class="btn" href="https://claude.ai/artifact/5Ym12ZgG8GEXkefyod6vRx" aria-label="Open Project Tracker">Open</a>
        </div>
      </div>

      <div class="card" role="listitem">
        <h2 class="card-title">Market Trends</h2>
        <div class="card-actions">
          <a class="btn" href="https://claude.ai/artifact/8wFnxtovTzvrKcgHpqxdq1" aria-label="Open Market Trends">Open</a>
        </div>
      </div>

      <div class="card" role="listitem">
        <h2 class="card-title">Fee Research</h2>
        <div class="card-actions">
          <a class="btn" href="https://claude.ai/artifact/MPA1nivAJJifoVMRzjJLjw" aria-label="Open Fee Research">Open</a>
        </div>
      </div>

      <div class="card" role="listitem">
        <h2 class="card-title">Map and Proforma (computer only)</h2>
        <div class="card-actions">
          <a class="btn" href="http://localhost:3001/" aria-label="Open Map and Proforma">Open</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
