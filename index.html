<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <p class="eyebrow">Land Advisors NW &middot; Internal Tools</p>
        <h1 class="font-display">Project Dashboard</h1>
      </div>
    </header>

    <div class="grid-wrap" role="list">
      <div class="card" role="listitem">
        <div class="card-top">
          <h2 class="card-title font-display">Builder Matrix</h2>
        </div>
        <div class="card-actions">
          <a class="btn btn-outline" href="https://rasmusnorkvist.github.io/builder_site/" aria-label="Open Builder Matrix">Open</a>
        </div>
      </div>

      <div class="card" role="listitem">
        <div class="card-top">
          <h2 class="card-title font-display">Project Tracker</h2>
        </div>
        <div class="card-actions">
          <a class="btn btn-outline" href="https://claude.ai/artifact/5Ym12ZgG8GEXkefyod6vRx" aria-label="Open Project Tracker">Open</a>
        </div>
      </div>

      <div class="card" role="listitem">
        <div class="card-top">
          <h2 class="card-title font-display">Market Trends</h2>
        </div>
        <div class="card-actions">
          <a class="btn btn-outline" href="https://claude.ai/artifact/8wFnxtovTzvrKcgHpqxdq1" aria-label="Open Market Trends">Open</a>
        </div>
      </div>

      <div class="card" role="listitem">
        <div class="card-top">
          <h2 class="card-title font-display">Comps Map</h2>
        </div>
        <div class="card-actions">
          <a class="btn btn-outline" href="https://claude.ai/artifact/EDgj61yPWDcFSz64vegfME" aria-label="Open Comps Map">Open</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
