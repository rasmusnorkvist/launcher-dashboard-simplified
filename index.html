<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <p class="eyebrow">Land Advisors NW &middot; Internal Tools</p>
        <h1 class="font-display">Project Dashboard</h1>
      </div>
    </header>

    <div class="grid-wrap" role="list">
      <div class="card" role="listitem">
        <div class="card-top">
          <h2 class="card-title font-display">Builder Matrix</h2>
        </div>
        <p class="card-description">Builder pricing and product comparison matrix.</p>
        <div class="card-actions">
          <a class="btn btn-outline" href="https://rasmusnorkvist.github.io/builder_site/" target="_blank" rel="noopener" aria-label="Open Builder Matrix in a new tab">Open</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
